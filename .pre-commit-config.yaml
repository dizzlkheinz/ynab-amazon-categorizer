repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: uvx typos
        language: system
        pass_filenames: false

      - id: ty
        name: ty check
        entry: uv run --extra dev ty check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: tach
        name: tach check
        entry: uv run --extra dev tach check
        language: system
        types: [python]
        pass_filenames: false

      - id: vibedrift
        name: vibedrift
        entry: npx --yes @vibedrift/cli scan . --format terminal --local-only --fail-on-score 90
        language: system
        pass_filenames: false

      - id: gitleaks
        name: gitleaks protect
        entry: gitleaks protect --staged
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run python -X utf8 -m pytest tests/ -v --cov=src --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false
