[build-system]
requires = ["setuptools>=80.10.2", "setuptools-scm>=9.2.2", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-amazon-categorizer"
dynamic = ["version"]
description = "Match Amazon orders to YNAB transactions with rich item information"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    {name = "dizzlkheinz"},
]
keywords = ["ynab", "amazon", "budgeting", "finance", "automation"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32.5",
    "prompt_toolkit>=3.0.52",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty==0.0.100",
    "tach>=0.35.0",
    "complexipy>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/dizzlkheinz/ynab-amazon-categorizer"
Repository = "https://github.com/dizzlkheinz/ynab-amazon-categorizer"
Issues = "https://github.com/dizzlkheinz/ynab-amazon-categorizer/issues"

[project.scripts]
ynab-amazon-categorizer = "ynab_amazon_categorizer.cli:main"

[tool.setuptools_scm]
version_file = "src/ynab_amazon_categorizer/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/ynab_amazon_categorizer/_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Owned by ruff format
    "COM812",  # missing trailing comma
    "E501",    # line too long

    # Docstring conventions
    "CPY001",  # missing copyright notice
    "D107",    # undocumented __init__ (class docstring carries the contract)
    "D203",    # conflicts with D211 (no blank line before class)
    "D213",    # conflicts with D212 (summary on first line)

    # Deliberate API and CLI design choices
    "ANN401",  # Any is needed for dynamic JSON payloads and item_details
    "DTZ007",  # Amazon order dates are naive local dates with no timezone
    "FBT001",  # positional boolean flags (dry_run, include_reconciled)
    "FBT002",  # boolean default value in positional arguments
    "FBT003",  # boolean positional value in call
    "PLR0913", # dependencies passed explicitly to orchestration helpers
    "PLR0917", # positional arguments to orchestration helpers
    "T201",    # print() is the CLI output mechanism

    # Exception and logging style
    "EM101",   # string literal in exception
    "EM102",   # f-string in exception
    "TRY003",  # message text lives directly in raise
    "TRY004",  # ValueError by contract for payload validation
    "TRY400",  # logger.error avoids noisy tracebacks in CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG002", "ARG005", "D", "PLR2004", "S101", "SLF001", "TC"]

[tool.ruff.lint.pylint]
# Guard-clause chains in amazon_parser.py read best as flat early returns.
max-returns = 8

[tool.ty.rules]
all = "error"
