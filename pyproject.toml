[build-system]
requires = ["setuptools>=80.10.2", "setuptools-scm>=9.2.2", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-amazon-categorizer"
dynamic = ["version"]
description = "Match Amazon orders to YNAB transactions with rich item information"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    {name = "dizzlkheinz"},
]
keywords = ["ynab", "amazon", "budgeting", "finance", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32.5",
    "prompt_toolkit>=3.0.52",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ty==0.0.78",
    "tach>=0.35.0",
    "pre-commit>=4.5.1",
]

[project.urls]
Homepage = "https://github.com/dizzlkheinz/ynab-amazon-categorizer"
Repository = "https://github.com/dizzlkheinz/ynab-amazon-categorizer"
Issues = "https://github.com/dizzlkheinz/ynab-amazon-categorizer/issues"

[project.scripts]
ynab-amazon-categorizer = "ynab_amazon_categorizer.cli:main"

[tool.setuptools_scm]
version_file = "src/ynab_amazon_categorizer/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ynab_amazon_categorizer = ["*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/ynab_amazon_categorizer/_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ARG005",   # unused args in monkeypatch lambda stubs
    "COM812",   # trailing comma; conflicts with ruff format
    "CPY001",   # copyright notice
    "E501",     # line too long; handled by the formatter
    "PLR2004",  # magic values are the point of a test fixture
    "PT009",
    "PT027",
    "S101",     # assert is how pytest works
    "T201",     # print: this is an interactive CLI

    # Exception style: the message text IS the user-facing error copy, so
    # hoisting it into a variable before `raise` only adds indirection.
    "EM101",
    "EM102",
    "TRY003",

    # dry_run / include_reconciled are positional bools throughout; making
    # them keyword-only is an API break across every call site for no gain.
    "FBT001",
    "FBT002",
    "FBT003",

    # CLI orchestration helpers take many collaborators deliberately: this
    # codebase passes dependencies explicitly rather than reaching for globals.
    "PLR0913",
    "PLR0917",

    # logger.exception would append tracebacks to an interactive CLI that
    # already prints a clean "Could not fetch X: {exc}" beside the log line.
    "TRY400",

    # validate_ynab_transaction raises ValueError by contract; its caller in
    # transactions.py catches ValueError to add the field path, and a
    # TypeError would escape that handler.
    "TRY004",

    # Amazon order dates are naive local dates with no zone information.
    "DTZ007",

    # __init__ docstrings: the class docstring carries the contract.
    "D107",

    # Test docstrings are single explanatory sentences wrapped over several
    # lines; forcing a one-line summary means rewriting the author's prose,
    # not reformatting it. All src/ docstrings already satisfy D205.
    "D205",

    # D212/D213 and D203/D211 are mutually exclusive pairs; ruff drops one of
    # each with a warning unless it is named here. This repo puts the summary
    # on the first line after the opening quotes (D212) and uses no blank line
    # before a class docstring (D211), so the other half of each pair goes.
    "D213",
    "D203",

    # memo item_details is genuinely str-or-dict; `object` breaks ty's
    # narrowing back to dict[str, Any] (verified this session).
    "ANN401",
]

[tool.ruff.lint.pylint]
# A parser built from guard clauses reads better as a flat chain of early
# returns than as nested conditionals; 8 accommodates _get_valid_cleaned_item.
max-returns = 8

[tool.typos.default]
extend-words = { "unparseable" = "unparseable" }

[tool.typos.files]
extend-exclude = [
    "graphify-out",
]


