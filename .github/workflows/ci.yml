name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run --extra dev python -X utf8 -m pytest tests/ -v --cov=src --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff format check
        run: uv run --extra dev ruff format --check src tests
      - name: Ruff lint
        run: uv run --extra dev ruff check src tests
      - name: Type check
        run: uv run --extra dev ty check src tests
      - name: Architecture check
        run: uv run --extra dev tach check
      - name: Complexity check
        run: uv run --extra dev complexipy src tests --max-complexity-allowed 10

  package:
    name: build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - name: Build package
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
      - name: Smoke-test installed CLI
        run: |
          .package-venv/bin/python -c "import ynab_amazon_categorizer.batch, ynab_amazon_categorizer.transactions"
          .package-venv/bin/ynab-amazon-categorizer --help
