name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Fetch full history and tags for setuptools-scm

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      with:
        python-version: "3.12"

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  create-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" $LAST_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --max-count=10)
        fi

        # Create release notes file (avoid overwriting repo CHANGELOG.md)
        cat > RELEASE_NOTES.md << EOF
        ## What's Changed

        $CHANGELOG

        ## Installation

        This package is now available on PyPI! Run or install it with:

        ```bash
        # Run directly with uvx (recommended)
        uvx ynab-amazon-categorizer

        # Or install with pipx
        pipx install ynab-amazon-categorizer

        # Or install with pip
        pip install ynab-amazon-categorizer
        ```

        ## Usage

        After installation, run:
        ```bash
        ynab-amazon-categorizer
        ```

        See README.md for detailed setup and configuration instructions.
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body_path: RELEASE_NOTES.md
        files: |
          README.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
